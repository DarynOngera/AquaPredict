services:
  backend:
    build:
      context: .
      dockerfile: modules/backend/Dockerfile.demo
    environment:
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      MODEL_ARTIFACTS_DIR: /app/model_artifacts
      GEE_PROJECT: ${GEE_PROJECT:-}
      GEE_SERVICE_ACCOUNT: ${GEE_SERVICE_ACCOUNT:-}
      GEE_PRIVATE_KEY_FILE: /app/credentials/gee_key.json
      # Optional Databricks SQL Warehouse report mirror (disabled by default).
      DATABRICKS_ENABLED: ${DATABRICKS_ENABLED:-false}
      DATABRICKS_HOST: ${DATABRICKS_HOST:-}
      DATABRICKS_WAREHOUSE_ID: ${DATABRICKS_WAREHOUSE_ID:-}
      # Copy the exact SQL Warehouse HTTP Path from Connection Details when set.
      DATABRICKS_HTTP_PATH: ${DATABRICKS_HTTP_PATH:-}
      DATABRICKS_CATALOG: ${DATABRICKS_CATALOG:-aquapredict}
      DATABRICKS_SCHEMA: ${DATABRICKS_SCHEMA:-reporting}
      DATABRICKS_CLIENT_ID: ${DATABRICKS_CLIENT_ID:-}
      DATABRICKS_CLIENT_SECRET: ${DATABRICKS_CLIENT_SECRET:-}
      # Legacy alternative. Prefer OAuth M2M credentials above.
      DATABRICKS_TOKEN: ${DATABRICKS_TOKEN:-}
    volumes:
      - ${GEE_CREDENTIALS_DIR:-./credentials}:/app/credentials:ro
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./modules/frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ""
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  proxy:
    image: nginx:1.27-alpine
    ports:
      - "${DEMO_PORT:-80}:80"
    volumes:
      - ./infrastructure/demo/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    restart: unless-stopped
