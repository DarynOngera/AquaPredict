services:
  backend:
    build:
      context: .
      dockerfile: modules/backend/Dockerfile.demo
    environment:
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      MODEL_ARTIFACTS_DIR: /app/model_artifacts
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./modules/frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  proxy:
    image: nginx:1.27-alpine
    ports:
      - "${DEMO_PORT:-80}:80"
    volumes:
      - ./infrastructure/demo/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    restart: unless-stopped
